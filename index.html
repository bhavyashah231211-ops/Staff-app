const brand=big=>{const c=C();return(c.logo?`<img src="${c.logo}" alt="" style="max-height:${big?96:34}px;max-width:${big?'100%':'120px'};object-fit:contain;${big?'align-self:center':''}">`:'')+`<h1 style="font-size:${big?34:22}px;${big?'text-align:center':''}">${esc(c.venue)}</h1>`};
function logoUp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,300/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k)||1;c.height=Math.round(im.height*k)||1;c.getContext('2d').drawImage(im,0,0,c.width,c.height);C().logo=c.toDataURL('image/png');C().logoW=c.width;C().logoH=c.height;sv()};im.onerror=()=>toast('Not a valid image');im.src=r.result};r.readAsDataURL(f);i.value=''}
const lt=id=>C().lv.find(x=>x.id==(id||'annual'))||C().lv[0]||{};
const EDGE=String.raw`import{serve}from"https://deno.land/std@0.224.0/http/server.ts";
serve(async r=>{const h={"Access-Control-Allow-Origin":"*","Access-Control-Allow-Headers":"authorization, x-client-info, apikey, content-type"};
if(r.method=="OPTIONS")return new Response("ok",{headers:h});
const u=await fetch(Deno.env.get("SUPABASE_URL")+"/rest/v1/cb_mgrs?select=email",{headers:{apikey:Deno.env.get("SUPABASE_ANON_KEY"),Authorization:r.headers.get("Authorization")}}).then(x=>x.json());
if(!Array.isArray(u)||!u.length)return new Response("managers only",{status:403,headers:h});
const b=await r.json();
const x=await fetch("https://api.resend.com/emails",{method:"POST",headers:{Authorization:"Bearer "+Deno.env.get("RESEND_KEY"),"Content-Type":"application/json"},body:JSON.stringify({from:Deno.env.get("MAIL_FROM"),to:b.to,subject:b.subject,html:b.html,attachments:b.pdf?[{filename:b.name,content:b.pdf}]:undefined})});
return new Response(await x.text(),{status:x.status,headers:h})})`;
function CARDS(){const c=C(),ck=(v,p)=>`<input type=checkbox ${v?'checked':''} onchange="${p}=this.checked?1:0;sv()">`;
return`<div class=card><b>Pay categories</b><p class=mu style="margin:4px 0">Name · £/hr or £/yr · default overtime ×. Picking one in Staff fills the pay, which you can still override.</p>${c.cats.map((k,i)=>`<div class=f><input style="width:120px" value="${esc(k.n)}" onchange="setv('cats.${i}.n',this.value,'text')"><select style="width:72px" onchange="setv('cats.${i}.type',this.value,'text')"><option value=h ${k.type=='h'?'selected':''}>£/hr</option><option value=a ${k.type=='a'?'selected':''}>£/yr</option></select><input type=number step=any style="width:78px" value="${k.pay}" onchange="setv('cats.${i}.pay',this.value,'number')"><input type=number step=any style="width:56px" value="${k.ot}" onchange="setv('cats.${i}.ot',this.value,'number')"><button class="s sm" onclick="C().cats.splice(${i},1);sv()">✕</button></div>`).join('')}<button class="s sm" style="margin-top:8px" onclick="C().cats.push({id:uid(),n:'New category',type:'h',pay:12.71,ot:1.5});sv()">+ Category</button></div>
<div class=card><b>Leave types</b><p class=mu style="margin:4px 0">Name · paid · uses holiday allowance · calendar colour. Sick pay is unpaid by default: statutory sick pay belongs in your payroll software.</p>${c.lv.map((l,i)=>`<div class=f><input style="width:120px" value="${esc(l.n)}" onchange="setv('lv.${i}.n',this.value,'text')"><label class=mu>paid ${ck(l.paid,`C().lv[${i}].paid`)}</label><label class=mu>allowance ${ck(l.cnt,`C().lv[${i}].cnt`)}</label><input type=color style="width:44px;padding:2px" value="${l.col}" onchange="setv('lv.${i}.col',this.value,'text')"><button class="s sm" onclick="C().lv.splice(${i},1);sv()">✕</button></div>`).join('')}<button class="s sm" style="margin-top:8px" onclick="C().lv.push({id:uid(),n:'New type',paid:1,cnt:0,col:'#ffa500'});sv()">+ Leave type</button></div>
<div class=card><b>Payslip emails</b><div class=f><span>Attach PDF to email</span>${ck(c.mail.attach,'C().mail.attach')}</div><div class=f><span>Edge function name</span><input value="${esc(c.mail.fn)}" onchange="C().mail.fn=this.value.trim();sv()"></div><p class=mu style="margin:6px 0">Setup: 1) Resend.com account + verified domain. 2) Supabase &gt; Edge Functions &gt; new function <b>${esc(c.mail.fn)}</b>, paste this. 3) Function secrets: RESEND_KEY and MAIL_FROM (e.g. Payroll &lt;pay@yourdomain.com&gt;). Only managers can trigger it.</p><pre>${esc(EDGE)}</pre><button class="s sm" onclick="navigator.clipboard.writeText(EDGE);toast('Copied')">Copy function</button></div>
${me.cloud?`<div class=card><b>Security</b><p class=mu style="margin:4px 0">Two-factor sign-in with an authenticator app.</p><button class="s sm" onclick=mfaOn()>Set up 2FA</button></div>`:''}`}
function catPick(id){const k=C().cats.find(x=>x.id==id);if(k){$('#e_type').value=k.type;$('#e_pay').value=k.pay}}
function forgot(){const e=$('#em').value.trim();if(!e)return toast('Enter your email first');sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('?')[0]}).then(r=>toast(r.error?r.error.message:'Reset link sent'))}
function mfaOn(){sb.auth.mfa.enroll({factorType:'totp'}).then(r=>{if(r.error)return toast(r.error.message);$('#v').innerHTML=`<h2>Set up 2FA</h2><div class=card><img src="${r.data.totp.qr_code}" width=180 style="background:#fff"><p class=mu style="margin:8px 0">Scan with Google Authenticator or Authy, then enter the 6-digit code.</p><input id=mc inputmode=numeric placeholder=123456> <button onclick="mfaOk('${r.data.id}')">Verify</button></div>`})}
function mfaOk(id){sb.auth.mfa.challengeAndVerify({factorId:id,code:$('#mc').value.trim()}).then(r=>{toast(r.error?r.error.message:'2FA is on');if(!r.error)frame()})}
function fin(){const rows=staff().map(s=>({s,p:pay(s)})),I=(k,s,v)=>`<input id=${k}_${s.id} type=number step=any style="width:80px" value="${v.toFixed(2)}">`;
$('#v').innerHTML=`<h2>Review &amp; finalise</h2><p class=mu style="margin-bottom:8px">${rows.length?esc(rows[0].p.lbl):''}. Tax, NI and pension are estimates: overwrite them with the figures from your payroll software. Finalising saves a locked payslip for each person and emails them.</p><div class="card tw"><table><tr><th>Staff</th><th>Email</th><th>Gross</th><th>Tax</th><th>NI</th><th>Pension</th></tr>${rows.map(({s,p})=>`<tr><td>${esc(s.name)}</td><td>${esc(s.pe)||'<span style="color:var(--rd)">missing</span>'}</td><td>${gbp(p.g)}</td><td>${I('tx',s,p.tax)}</td><td>${I('ni',s,p.ni)}</td><td>${I('pn',s,p.pen)}</td></tr>`).join('')}</table></div><button onclick=finGo()>Finalise &amp; send</button> <button class=s onclick=frame()>Cancel</button>`}
async function finGo(){const key=iso(range()[0])+':'+(per||C().period);if(R('slip').some(x=>x.key==key)&&!confirm('This period was already finalised. Issue again?'))return;let ok=0;const bad=[];
for(const s of staff()){const p=pay(s),g=id=>+$('#'+id+'_'+s.id).value||0,tax=g('tx'),ni=g('ni'),pen=g('pn'),sl={id:uid(),t:'slip',sid:s.id,email:s.email,pe:s.pe,name:s.name,cat:(C().cats.find(x=>x.id==s.cat)||{}).n||'',key,lbl:p.lbl,hrs:p.hrs,base:p.base,hol:p.hol,ot:p.ot,g:p.g,tax,ni,pen,net:p.g-tax-ni-pen,at:Date.now()};
put(sl);if(!s.pe){bad.push(s.name);continue}try{await mail(sl);ok++}catch(e){bad.push(s.name)}}
tab='pay';frame();toast(ok+' emailed'+(bad.length?' · failed: '+bad.join(', '):''))}
async function mail(sl){if(!sb)throw 0;const c=C().mail,pdf=c.attach?slipPdf(sl).split(',')[1]:null,html=`<p>Hi ${esc(sl.name.split(' ')[0])},</p><p>Your payslip for ${esc(sl.lbl)} is ready${pdf?' (attached)':''}. Net pay: <b>${gbp(sl.net)}</b>.</p><p>You can download it any time in CBSystem Staff under Pay.</p>`;
const r=await sb.functions.invoke(c.fn,{body:{to:sl.pe,subject:'Your payslip: '+sl.lbl,html,pdf,name:'payslip-'+sl.lbl.replace(/\W+/g,'-')+'.pdf'}});if(r.error)throw r.error}
function slipPdf(sl,save){const{jsPDF}=window.jspdf,d=new jsPDF(),L=(t,y)=>d.text(String(t),20,y),Rt=(t,y)=>d.text(String(t),190,y,{align:'right'});let y=62;
let lx=20;if(C().logo){const hh=18,ww=Math.min(60,hh*C().logoW/C().logoH);d.addImage(C().logo,'PNG',20,10,ww,hh);lx=ww+26}d.setFontSize(20);d.text(C().venue,lx,22);d.setFontSize(11);L('PAYSLIP: '+sl.lbl,30);L(sl.name+(sl.cat?' ('+sl.cat+')':''),38);L('Issued '+new Date(sl.at).toLocaleDateString('en-GB'),46);
const row=(a,b,bold)=>{d.setFont(undefined,bold?'bold':'normal');L(a,y);Rt(b,y);y+=8};
row('Hours worked',sl.hrs.toFixed(2));row('Basic pay',gbp(sl.base));row('Holiday pay',gbp(sl.hol));row('Overtime',gbp(sl.ot));row('Gross pay',gbp(sl.g),1);y+=4;row('Income tax',gbp(sl.tax));row('National Insurance',gbp(sl.ni));row('Pension (employee)',gbp(sl.pen));y+=4;row('NET PAY',gbp(sl.net),1);
d.setFont(undefined,'normal');d.setFontSize(8);L('Deductions are as entered by the employer. Keep this for your records.',y+12);
if(save)d.save('payslip-'+sl.lbl.replace(/\W+/g,'-')+'.pdf');return d.output('datauristring')}
function slipList(){const l=R('slip').filter(x=>isM()||x.sid==me.id).sort((a,b)=>b.at-a.at).slice(0,40);return`<h2 style="margin-top:18px;font-size:20px">Payslips</h2><div class="card tw"><table>${l.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.lbl)}</td><td>${gbp(x.net)}</td><td><button class="s sm" onclick="slipPdf(R('slip').find(y=>y.id=='${x.id}'),1)">PDF</button></td></tr>`).join('')||'<tr><td class=mu>None yet</td></tr>'}</table></div>`}
const q=new URLSearchParams(location.search).get('clock');if(q)sessionStorage.cbclock=q;
login();
</script></body></html>
