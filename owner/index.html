<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CBS Employee Management: Owner</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#17202b;--mute:#5d6b7a;--line:#d9e0e6;--acc:#0b6b5c;--acc-ink:#fff;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12181e;--card:#1b242c;--ink:#e8edf1;--mute:#9aa8b5;--line:#2b3742;--acc:#35b9a3;--acc-ink:#07201b;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.4rem;margin:0}h2{font-size:1.05rem;margin:0 0 12px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
button{padding:10px 16px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:16px}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar>div{display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.site{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--card)}
.site b{display:block;font-size:1.05rem}
.stat{display:flex;justify-content:space-between;margin-top:6px}.stat span:last-child{font-weight:700}
.mute{color:var(--mute);font-size:.9rem}
.tot{font-size:2rem;font-weight:700}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:.9rem;color:var(--mute);margin-bottom:4px}
.msg{margin-top:10px;min-height:1.3em}.err{color:var(--bad)}
.off{opacity:.6}
.login{max-width:380px;margin:12vh auto 0}.login .box>*+*{margin-top:12px}
</style>
</head>
<body>
<main>
<section id="login" class="login" hidden>
  <h1>Owner sign in</h1>
  <div class="box">
    <div><label for="g">Group id</label><input id="g" autocomplete="username" autocapitalize="none"></div>
    <div><label for="k">Owner key</label><input id="k" type="password" autocomplete="current-password"></div>
    <button class="p" id="go" style="width:100%">Sign in</button>
    <div class="msg err" id="lerr" role="alert"></div>
  </div>
</section>

<section id="app" hidden>
  <div class="bar"><h1 id="title">Your businesses</h1><div><button id="out">Sign out</button></div></div>
  <div class="box"><span class="mute">All businesses</span><div class="tot" id="tot">-</div><div class="mute" id="totsub"></div></div>
  <div class="box"><h2>This week</h2><div class="grid" id="sites"></div><div class="msg err" id="rerr" role="alert"></div>
    <p class="mute">Hours are from the clock-in and clock-out records since Monday (UTC).</p></div>

  <section class="box" id="edit" hidden>
    <h2 id="etitle">Settings</h2>
    <div class="f">
      <div><label for="venue">Company name</label><input id="venue"></div>
      <div><label for="payRef">Bank payment reference</label><input id="payRef" maxlength="18"></div>
      <div><label for="period">Pay period</label><select id="period"><option value="w">Weekly</option><option value="m">Monthly</option></select></div>
    </div>
    <div class="bar" style="margin-top:14px"><div><button class="p" id="save">Save changes</button><button id="close">Close</button></div></div>
    <div class="msg" id="emsg" role="status"></div>
    <p class="mute">Staff devices pick up saved changes on their next sync.</p>
  </section>
</section>
</main>

<script>
const API = 'https://hrnrmojaaxyfmdnmsokc.supabase.co/functions/v1/cbs-biz';
const $ = (i) => document.getElementById(i);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let S = null, cur = null;
try { S = JSON.parse(sessionStorage.getItem('cbs_clock_owner') || 'null'); } catch (e) {}

async function call(a, extra) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ a, org: S.org, key: S.key, ...extra }) });
  const j = await r.json().catch(() => ({ error: 'Bad response from server' }));
  if (!r.ok || j.error) throw new Error(j.error || 'Request failed');
  return j;
}
async function load() {
  $('rerr').textContent = '';
  try {
    const j = await call('oreport');
    $('title').textContent = j.org;
    const ppl = j.sites.reduce((a, s) => a + s.people, 0), hrs = j.sites.reduce((a, s) => a + s.hours_week, 0), on = j.sites.reduce((a, s) => a + s.on_shift, 0);
    $('tot').textContent = hrs.toFixed(1) + ' hours';
    $('totsub').textContent = ppl + ' people · ' + on + ' on shift now · ' + j.sites.length + ' business' + (j.sites.length === 1 ? '' : 'es');
    $('sites').innerHTML = j.sites.length ? j.sites.map((s) => `
      <div class="site ${s.active ? '' : 'off'}">
        <b>${esc(s.name)}</b>${s.active ? '' : '<span class="mute">suspended</span>'}
        <div class="stat"><span>Hours this week</span><span>${s.hours_week.toFixed(1)}</span></div>
        <div class="stat"><span>On shift now</span><span>${s.on_shift}</span></div>
        <div class="stat"><span>People</span><span>${s.people}</span></div>
        <div class="stat"><span>Holiday requests waiting</span><span>${s.pending_holidays}</span></div>
        <button style="margin-top:12px" data-site="${esc(s.id)}">Edit settings</button>
      </div>`).join('') : '<p class="mute">No businesses are linked to this group yet. Ask your provider to add them.</p>';
  } catch (e) { fail(e); }
}
function fail(e) {
  if (/Wrong group|suspended|Too many/.test(e.message)) { signOut(); $('lerr').textContent = e.message; }
  else $('rerr').textContent = e.message;
}
async function openSite(id) {
  $('emsg').textContent = ''; $('emsg').className = 'msg';
  try {
    const j = await call('oget', { site: id });
    cur = id; $('etitle').textContent = 'Settings: ' + j.venue;
    $('venue').value = j.venue; $('payRef').value = j.payRef; $('period').value = j.period;
    $('edit').hidden = false; $('edit').scrollIntoView({ behavior: 'smooth' });
  } catch (e) { $('rerr').textContent = e.message; }
}
async function save() {
  try { await call('osave', { site: cur, venue: $('venue').value, payRef: $('payRef').value, period: $('period').value }); $('emsg').textContent = 'Saved'; $('emsg').className = 'msg'; load(); }
  catch (e) { $('emsg').textContent = e.message; $('emsg').className = 'msg err'; }
}
function show() { $('login').hidden = !!S; $('app').hidden = !S; if (S) load(); }
function signOut() { S = null; sessionStorage.removeItem('cbs_clock_owner'); $('edit').hidden = true; show(); }

$('go').onclick = async () => {
  $('lerr').textContent = '';
  S = { org: $('g').value.trim().toLowerCase(), key: $('k').value.trim() };
  try { await call('oreport'); sessionStorage.setItem('cbs_clock_owner', JSON.stringify(S)); $('k').value = ''; show(); }
  catch (e) { S = null; $('lerr').textContent = e.message; }
};
$('k').onkeydown = (e) => { if (e.key === 'Enter') $('go').click(); };
$('out').onclick = signOut;
$('save').onclick = save;
$('close').onclick = () => { $('edit').hidden = true; };
$('sites').onclick = (e) => { const b = e.target.closest('[data-site]'); if (b) openSite(b.dataset.site); };
show();
</script>
</body>
</html>
